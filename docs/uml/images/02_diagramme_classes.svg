<rect x="35" y="1060" width="2145" height="500" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="53" y="1091" font-size="18" fill="#334155" font-weight="700" text-anchor="start">Associations et contraintes UML</text>
<text x="65" y="1115" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">Héritage · exploitation</text>
<text x="65" y="1150" font-size="15" fill="#1e293b" font-weight="400" text-anchor="start"><tspan x="65" dy="0">User &lt;|-- Client, Driver, Admin; Client &lt;|-- ClientPMR</tspan><tspan x="65" dy="47">City 1 — 0..* Route (origine et destination)</tspan><tspan x="65" dy="47">Route 1 — 0..* Trip; Vehicle 1 *-- 1..* Seat</tspan><tspan x="65" dy="47">Vehicle / Driver — Trip; Vehicle / Driver — DriverAssignment</tspan><tspan x="65" dy="47">Admin valide les affectations temporaires et le statut PMR</tspan><tspan x="65" dy="47">Trip 1 — 0..* GPSLocation</tspan></text>
<text x="770" y="1115" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">Réservation · vente</text>
<text x="770" y="1150" font-size="15" fill="#1e293b" font-weight="400" text-anchor="start"><tspan x="770" dy="0">Client 1 — 0..* Reservation; Trip 1 — 0..* Reservation</tspan><tspan x="770" dy="47">Seat 1 — 0..* Reservation; Trip 1 — 0..* WalkInSale</tspan><tspan x="770" dy="47">Driver enregistre WalkInSale et scanne BoardingRecord</tspan><tspan x="770" dy="47">Reservation 1 — 0..1 Payment / Ticket</tspan><tspan x="770" dy="47">WalkInSale 1 — 1 Payment / Ticket</tspan><tspan x="770" dy="47">Ticket 1 — 0..1 BoardingRecord</tspan></text>
<text x="1480" y="1115" font-size="18" fill="#0f172a" font-weight="700" text-anchor="start">Règles métier représentées</text>
<text x="1480" y="1150" font-size="15" fill="#1e293b" font-weight="400" text-anchor="start"><tspan x="1480" dy="0">Plafond 25 % : réservation préalable avec paiement sur place</tspan><tspan x="1480" dy="47">Vente directe : aucun plafond si des sièges sont libres</tspan><tspan x="1480" dy="47">Un siège ne peut pas être attribué deux fois par départ</tspan><tspan x="1480" dy="47">Un ticket vient d’une réservation OU d’une vente directe (XOR)</tspan><tspan x="1480" dy="47">Paiement, réservation et embarquement ont des statuts distincts</tspan><tspan x="1480" dy="47">Cardinalités reprises de la source PlantUML</tspan></text>
<text x="42" y="1634" font-size="15" fill="#64748b" font-weight="400" text-anchor="start">Version de travail : les choix métier du README restent à confirmer avec l’équipe.</text>
</svg>