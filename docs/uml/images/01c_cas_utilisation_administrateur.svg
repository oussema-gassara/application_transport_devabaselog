<text x="48" y="82" class="subtitle">Diagramme de cas d’utilisation — périmètre V1 | Bus interurbains et louages</text>
<rect x="390" y="130" width="1030" height="1052" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="420" y="165" font-size="18" font-weight="700" fill="#334155" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Plateforme de réservation et de gestion du transport interurbain</text><circle cx="160" cy="600.0" r="14" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><line x1="160" y1="614.0" x2="160" y2="658.0" stroke="#7c3aed" stroke-width="3"/><line x1="138" y1="628.0" x2="182" y2="628.0" stroke="#7c3aed" stroke-width="3"/><line x1="160" y1="658.0" x2="142" y2="684.0" stroke="#7c3aed" stroke-width="3"/><line x1="160" y1="658.0" x2="178" y2="684.0" stroke="#7c3aed" stroke-width="3"/><text x="160" y="711.0" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">Administrateur</text><ellipse cx="900" cy="225" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="229.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Gérer les villes et les liaisons directes</tspan></text><ellipse cx="900" cy="303" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="307.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Gérer les véhicules, capacités et sièges</tspan></text><ellipse cx="900" cy="381" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="385.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Gérer les comptes et les rôles</tspan></text><ellipse cx="900" cy="459" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="463.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Affecter un chauffeur à un véhicule</tspan></text><ellipse cx="900" cy="537" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="541.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Affecter temporairement un chauffeur remplaçant</tspan></text><ellipse cx="900" cy="615" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="619.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Créer, modifier et publier les départs</tspan></text><ellipse cx="900" cy="693" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="697.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Examiner les propositions de départ des chauffeurs</tspan></text><ellipse cx="900" cy="771" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="775.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Vérifier et activer le statut PMR</tspan></text><ellipse cx="900" cy="849" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="853.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Consulter les réservations, paiements et ventes</tspan></text><ellipse cx="900" cy="927" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="931.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Gérer les annulations et remboursements</tspan></text><ellipse cx="900" cy="1005" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="1009.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Consulter les statistiques et l’activité des véhicules</tspan></text><path d="M 210 636.0 L 330 636.0 L 330 225 L 545 225" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 303 L 545 303" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 381 L 545 381" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 459 L 545 459" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 537 L 545 537" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 615 L 545 615" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 693 L 545 693" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 771 L 545 771" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 849 L 545 849" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 927 L 545 927" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 636.0 L 330 636.0 L 330 1005 L 545 1005" fill="none" stroke="#94a3b8" stroke-width="1.15"/><rect x="440" y="1108" width="440" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="460" y="1136" font-size="13" font-weight="500" fill="#78350f" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="460" dy="0">L’administrateur publie les départs.</tspan><tspan x="460" dy="17.55">Les propositions du chauffeur nécessitent approbation.</tspan></text><rect x="920" y="1108" width="440" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="940" y="1136" font-size="13" font-weight="500" fill="#78350f" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="940" dy="0">Les règles de remboursement et de non-présentation</tspan><tspan x="940" dy="17.55">restent à définir avant le développement.</tspan></text></svg>