<text x="48" y="54" class="title">01 — Cas d’utilisation : Chauffeur</text>
<text x="48" y="82" class="subtitle">Diagramme de cas d’utilisation — périmètre V1 | Bus interurbains et louages</text>
<rect x="390" y="130" width="1030" height="970" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text x="420" y="165" font-size="18" font-weight="700" fill="#334155" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Plateforme de réservation et de gestion du transport interurbain</text><circle cx="160" cy="559.0" r="14" fill="#ffffff" stroke="#b45309" stroke-width="3"/><line x1="160" y1="573.0" x2="160" y2="617.0" stroke="#b45309" stroke-width="3"/><line x1="138" y1="587.0" x2="182" y2="587.0" stroke="#b45309" stroke-width="3"/><line x1="160" y1="617.0" x2="142" y2="643.0" stroke="#b45309" stroke-width="3"/><line x1="160" y1="617.0" x2="178" y2="643.0" stroke="#b45309" stroke-width="3"/><text x="160" y="670.0" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">Chauffeur</text><ellipse cx="900" cy="225" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="229.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Consulter les départs affectés à son véhicule</tspan></text><ellipse cx="900" cy="303" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="307.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Déclarer sa disponibilité</tspan></text><ellipse cx="900" cy="381" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="385.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Proposer un nouveau départ à l’administrateur</tspan></text><ellipse cx="900" cy="459" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="463.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Enregistrer une vente directe à la station</tspan></text><ellipse cx="900" cy="537" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="541.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Scanner le QR Code d’un billet</tspan></text><ellipse cx="900" cy="615" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="619.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Confirmer l’encaissement en espèces</tspan></text><ellipse cx="900" cy="693" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="697.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Ouvrir et fermer l’embarquement</tspan></text><ellipse cx="900" cy="771" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="775.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Démarrer et terminer un trajet</tspan></text><ellipse cx="900" cy="849" rx="355" ry="30" fill="#f8fbff" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="853.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Transmettre la position GPS du véhicule</tspan></text><ellipse cx="900" cy="927" rx="355" ry="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="900" y="931.55" font-size="13" font-weight="500" fill="#1e293b" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="900" dy="0">Signaler un retard ou une panne</tspan></text><path d="M 210 595.0 L 330 595.0 L 330 225 L 545 225" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 303 L 545 303" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 381 L 545 381" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 459 L 545 459" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 537 L 545 537" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 615 L 545 615" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 693 L 545 693" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 771 L 545 771" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 849 L 545 849" fill="none" stroke="#94a3b8" stroke-width="1.15"/><path d="M 210 595.0 L 330 595.0 L 330 927 L 545 927" fill="none" stroke="#94a3b8" stroke-width="1.15"/><rect x="440" y="1030" width="440" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="460" y="1058" font-size="13" font-weight="500" fill="#78350f" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="460" dy="0">Chaque véhicule a un chauffeur attitré en V1.</tspan><tspan x="460" dy="17.55">Un remplaçant temporaire est affecté par l’admin.</tspan></text><rect x="920" y="1030" width="440" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/><text x="940" y="1058" font-size="13" font-weight="500" fill="#78350f" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif"><tspan x="940" dy="0">Le chauffeur ne peut scanner qu’un billet</tspan><tspan x="940" dy="17.55">valide pour son départ et non déjà utilisé.</tspan></text></svg>